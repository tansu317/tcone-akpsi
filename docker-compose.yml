services:
  postgres:
    image: postgres:16
    container_name: siproperti-db
    environment:
      POSTGRES_USER: siproperti
      POSTGRES_PASSWORD: siproperti
      POSTGRES_DB: siproperti
      TZ: Asia/Jakarta
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - siproperti_pg:/var/lib/postgresql/data
      - ./database/siproperti_local.sql:/docker-entrypoint-initdb.d/01_siproperti_local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siproperti -d siproperti"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  siproperti_pg:
