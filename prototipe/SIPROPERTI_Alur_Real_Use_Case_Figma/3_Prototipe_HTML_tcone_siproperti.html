 <div class="g12"><div class="box"><div class="bh">Temuan Disparitas – ${L.no}</div><div class="bb"><dl class="kv"><dt>Nama Pemohon</dt><dd>${L.pem}</dd><dt>Amar draf putusan</dt><dd>${d.draf}</dd><dt>Indeks disparitas</dt><dd style="color:#dd4b39">${L.idx.toFixed(2).replace(".",",")} (ambang 0,60)</dd><dt>Putusan sejenis</dt><dd>${t} putusan; ${t-same} beramar berbeda</dd><dt>Tanggal deteksi</dt><dd>${L.w}</dd></dl>
 <table style="margin-top:10px"><thead><tr><th>Putusan terkait</th><th>Majelis</th><th>Amar</th></tr></thead><tbody>${SIM.slice(0,4).map((x,i)=>`<tr><td>${x.no.split(" ")[0]}</td><td>Majelis ${"ABCD"[i]}</td><td>${x.amar}</td></tr>`).join("")}</tbody></table><div class="small" style="margin-top:6px">Nama majelis disamarkan pada tampilan agregat.</div></div></div>
 <div class="box"><div class="bh">Peninjauan Pimpinan</div><div class="bb" id="dec" style="display:flex;flex-direction:column;gap:10px">${dec}</div></div></div><div class="btns"><button class="btn" onclick="go('laplist')">Kembali ke Daftar Laporan</button></div>`);}
function setL(st){const L=DB.lap.find(x=>x.id===S.p.id);L.st=st;L.hist.push(st);audit("Status laporan disparitas: "+st,L.id);toast("Status laporan menjadi "+st)}

function vRiwayat(){const all=Object.values(DB.pred).flat().slice().reverse();return shell("<b>Riwayat Prediksi</b>",`<div class="box"><div class="bh">Riwayat Prediksi Putusan</div><div class="bb">${dtc()}<table><thead><tr><th>ID Prediksi</th><th>No. Sengketa</th><th>Amar Prediksi</th><th>Keyakinan</th><th>Waktu</th><th>Dibuat oleh</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${all.map(p=>`<tr><td>${p.id}</td><td>${sg(p.sid).no}</td><td>${p.amar}</td><td>${pc(p.conf)}</td><td>${p.when}</td><td>${esc(p.who)}</td><td><span class="pill ${p.status==="Aktif"?"p-g":"p-x"}">${p.status}</span></td><td><button class="btn bp" onclick="go('hasil',{sid:'${p.sid}',ver:${p.ver}})">${I.eye}</button></td></tr>`).join("")}</tbody></table></div></div>`)}
function vEvalKu(){return shell("<b>Evaluasi & Feedback</b>",`<div class="g2"><div class="box"><div class="bh">Evaluasi Hasil Prediksi</div><div class="bb"><table><thead><tr><th>Prediksi</th><th>Status</th><th>Waktu</th></tr></thead><tbody>${DB.evalP.map(e=>`<tr><td>${e.pid}</td><td>${e.st}</td><td>${e.w}</td></tr>`).join("")||'<tr><td colspan="3" class="small">Belum ada</td></tr>'}</tbody></table></div></div><div class="box"><div class="bh">Feedback ChatAI</div><div class="bb"><table><thead><tr><th>Prediksi</th><th>Jenis</th><th>Rating</th><th>Status</th></tr></thead><tbody>${DB.fb.map(f=>`<tr><td>${f.pid}</td><td>${f.j}</td><td>${f.r}/5</td><td>${f.st}</td></tr>`).join("")||'<tr><td colspan="4" class="small">Belum ada</td></tr>'}</tbody></table></div></div></div>`)}
function vChatKu(){const cs=Object.entries(DB.chat);return shell("<b>Sesi ChatAI</b>",`<div class="box"><div class="bh">Riwayat Sesi ChatAI</div><div class="bb"><table><thead><tr><th>Sesi</th><th>Prediksi</th><th>Mulai</th><th>Jumlah pesan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${cs.map(([k,c])=>`<tr><td>${c.id}</td><td>${k}</td><td>${c.mulai}</td><td>${c.msgs.length}</td><td>${c.st}</td><td><button class="btn bp" onclick="go('chat',{sid:'${c.sid}',t:'Penjelasan Reasoning'})">Buka Kembali</button></td></tr>`).join("")||'<tr><td colspan="6" class="small">Belum ada sesi</td></tr>'}</tbody></table></div></div>`)}
function vAudit(){return shell("<b>Jejak Audit</b>",`<div class="box"><div class="bh">Jejak Audit (tidak dapat diubah)</div><div class="bb">${dtc()}<table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Objek</th></tr></thead><tbody>${DB.audit.map(a=>`<tr><td>${a.w}</td><td>${esc(a.u)}</td><td>${esc(a.a)}</td><td>${esc(a.o)}</td></tr>`).join("")}</tbody></table></div></div>`)}
/* ---------- CALLOUTS (untuk dokumentasi) ---------- */
function mark(list){document.querySelectorAll('.callout').forEach(e=>e.remove());list.forEach(([q,n,pad])=>{const el=document.querySelector(q);if(!el)return;const r=el.getBoundingClientRect(),p=pad??4;const c=document.createElement('div');c.className='callout';c.style.left=(r.left+scrollX-p)+'px';c.style.top=(r.top+scrollY-p)+'px';c.style.width=(r.width+2*p)+'px';c.style.height=(r.height+2*p)+'px';c.innerHTML=(r.left-p<14)?'<span style="left:auto;right:-13px">'+n+'</span>':'<span>'+n+'</span>';document.body.appendChild(c)})}
const V={login:vLogin,home:vHome,pen:vPen,proses:vProses,hasil:vHasil,analisis:vAnalisis,banding:vBanding,dok:vDok,eval:vEval,evala:vEvalA,chat:vChat,disp:vDisp,disphasil:vDispHasil,laplist:vLapList,lap:vLap,riwayat:vRiwayat,evalku:vEvalKu,chatku:vChatKu,audit:vAudit};
function render(){if(!S.role&&S.scr!=="login")S.scr="login";document.querySelectorAll('.callout').forEach(e=>e.remove());$("#root").innerHTML=V[S.scr]()}
render();
</script>
